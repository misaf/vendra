name: vendra

# Six services mount the shared storage-data volume. Docker seeds a named volume
# from the image the first time it is mounted, and creating them concurrently
# races: one wins and the rest fail with "mkdir ...: file exists". Starting the
# others after php means the volume is already seeded by the time they mount it.
x-datastores: &datastores
  mysql: {condition: service_healthy}
  redis: {condition: service_healthy}

# Healthy, not merely started. Migrations run in the entrypoint, and only for
# the container whose command is frankenphp — so php migrates and every service
# below skips it. Waiting on php having *started* let them begin against a
# half-applied schema: php-api serving requests, five workers consuming jobs.
# `migrate --isolated` does not close that either, because a second caller skips
# the migration rather than waiting for it. php's healthcheck already gates on
# /up after the entrypoint has finished, and carries a start period sized for a
# first boot's migrations, so it is the signal that was wanted all along.
x-after-app: &after-app
  mysql: {condition: service_healthy}
  redis: {condition: service_healthy}
  php: {condition: service_healthy}
x-platform-environment: &platform-environment
  APP_NAME: "${APP_NAME:-Vendra}"
  APP_ENV: production
  APP_KEY: "${APP_KEY:?required}"
  APP_DEBUG: "false"
  APP_URL: "https://${BASE_DOMAIN:?required}"
  ASSET_URL: "https://${BASE_DOMAIN:?required}"
  TIMEZONE: "${TIMEZONE:-UTC}"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_DATABASE: "${DB_DATABASE:-vendra}"
  DB_USERNAME: "${DB_USERNAME:-vendra}"
  DB_PASSWORD: "${DB_PASSWORD:?required}"
  REDIS_HOST: redis
  REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
  SESSION_ENCRYPT: "${SESSION_ENCRYPT:-true}"
  SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
  SESSION_DOMAIN: "${SESSION_DOMAIN:-null}"
  FILESYSTEM_DISK: "${FILESYSTEM_DISK:-public}"
  # stderr, not a file. Only /app/storage/app is a volume, so a file channel
  # writes into each container's own writable layer: seven partial logs, none
  # visible to `vendra logs`, all destroyed when a container is replaced — which
  # is on every deploy, exactly when they are wanted. The runtime collects
  # stderr, so this is what makes `vendra logs <service>` show the application.
  LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
  LOG_LEVEL: "${LOG_LEVEL:-warning}"
  PULSE_INGEST_DRIVER: redis
  PULSE_REDIS_CONNECTION: cache
  APP_MAINTENANCE_DRIVER: "${APP_MAINTENANCE_DRIVER:-cache}"
  APP_MAINTENANCE_STORE: "${APP_MAINTENANCE_STORE:-redis}"
  SETTINGS_CACHE_ENABLED: "${SETTINGS_CACHE_ENABLED:-true}"
  CONTAINER_DRIVER: "${CONTAINER_RUNTIME:-docker}"
  DOCKER_HOST: unix:///var/run/docker.sock
  PODMAN_HOST: unix:///var/run/docker.sock
  STOREFRONT_NETWORK: "${STOREFRONT_NETWORK:-traefik-public}"
  STOREFRONT_PULL: "${STOREFRONT_PULL:-true}"
  STOREFRONT_PORT: "${STOREFRONT_PORT:-3000}"
  STOREFRONT_HEALTH_PATH: "${STOREFRONT_HEALTH_PATH:-/api/health}"
  STOREFRONT_HEALTH_TIMEOUT: "${STOREFRONT_HEALTH_TIMEOUT:-120}"
  STOREFRONT_LOG_DRIVER: "${STOREFRONT_LOG_DRIVER-json-file}"
  STOREFRONT_LOG_MAX_SIZE: "${STOREFRONT_LOG_MAX_SIZE:-10m}"
  STOREFRONT_LOG_MAX_FILE: "${STOREFRONT_LOG_MAX_FILE:-5}"
  STOREFRONT_BASE_DOMAIN: "${BASE_DOMAIN:?required}"
  STOREFRONT_API_URL: "${STOREFRONT_API_URL:-}"
  STOREFRONT_CERT_RESOLVER: "${CERT_RESOLVER:-}"
  STOREFRONT_CERTIFICATES_PATH: "${STOREFRONT_CERTIFICATES_PATH:-}"
  STOREFRONT_CA_FILE: "${STOREFRONT_CA_FILE:-}"
  STOREFRONT_STORAGE_BASE_URL: "${STOREFRONT_STORAGE_BASE_URL:-}"
  MAIL_MAILER: "${MAIL_MAILER:-smtp}"
  MAIL_HOST: "${MAIL_HOST:-}"
  MAIL_PORT: "${MAIL_PORT:-587}"
  MAIL_USERNAME: "${MAIL_USERNAME:-}"
  MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Vendra}"
  HORIZON_NOTIFY_MAIL: "${HORIZON_NOTIFY_MAIL:-}"
  CONSOLE_USER_EMAIL: "${CONSOLE_USER_EMAIL:-}"
  CONSOLE_USER_PASSWORD: "${CONSOLE_USER_PASSWORD:-}"
  NESHAN_SERVICE_KEY: "${NESHAN_SERVICE_KEY:-}"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?required}"
      MYSQL_DATABASE: "${DB_DATABASE:-vendra}"
      MYSQL_USER: "${DB_USERNAME:-vendra}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?required}"
    volumes: ["mysql-data:/var/lib/mysql"]
    networks: [internal]
    # Loopback by default, which covers both ways people reach this database:
    # locally you connect from the same machine, and on a server an SSH tunnel
    # terminates on the host and dials its loopback. A bare "3306:3306" would
    # publish the database on every interface of a multi-tenant host.
    ports: ["${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    volumes: ["redis-data:/data"]
    networks: [internal]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 6}

  php: &php
    image: "${VENDRA_PLATFORM_IMAGE:?required}"
    restart: unless-stopped
    environment: *platform-environment
    expose: ["8080"]
    volumes: ["storage-data:/app/storage/app"]
    networks: [internal, traefik-public]
    depends_on: *datastores
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.vendra-panels.loadbalancer.server.port=8080"

  php-api:
    <<: *php
    depends_on: *after-app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.vendra-api.loadbalancer.server.port=8080"

  horizon:
    <<: *php
    depends_on: *after-app
    command: ["php", "artisan", "horizon"]
    networks: [internal]
    labels: []
    healthcheck: {disable: true}

  # Storefront provisioning, isolated from every other queued job.
  #
  # This is the only container in the estate holding a container-runtime socket.
  # Under Docker that socket is root-equivalent on the host; under rootless
  # Podman it is not, which is the reason to prefer it. Horizon's supervisor
  # deliberately does not list the "storefronts" queue, so provisioning runs here
  # and nothing else does. Widening this container's queues, or handing the
  # socket to Horizon, gives every job in the system that access.
  storefront-worker:
    <<: *php
    depends_on: *after-app
    command: ["php", "artisan", "queue:work", "--queue=storefronts", "--tries=5", "--timeout=180"]
    volumes:
      - "storage-data:/app/storage/app"
      # Whatever the host socket is, it is always mounted at the Docker path, so
      # DOCKER_HOST and PODMAN_HOST above both point at this mounted socket;
      # CONTAINER_DRIVER selects the Laravel Docker Engine driver.
      - "${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
    networks: [internal]
    labels: []
    healthcheck: {disable: true}

  scheduler:
    <<: *php
    depends_on: *after-app
    command: ["php", "artisan", "schedule:work"]
    networks: [internal]
    labels: []
    healthcheck: {disable: true}

  # Server metrics (CPU, memory, storage). Without this the Pulse dashboard
  # renders but its server cards stay empty.
  pulse:
    <<: *php
    depends_on: *after-app
    command: ["php", "artisan", "pulse:check"]
    # Stable hostname so stats record under one name across container
    # replacements instead of fragmenting across random container IDs.
    hostname: "vendra-app"
    networks: [internal]
    labels: []
    healthcheck: {disable: true}

  # Drains the Redis ingest buffer into storage. Required whenever
  # PULSE_INGEST_DRIVER=redis — without it, entries buffer and never land, and
  # the dashboard goes silently empty.
  pulse-worker:
    <<: *php
    depends_on: *after-app
    command: ["php", "artisan", "pulse:work"]
    networks: [internal]
    labels: []
    healthcheck: {disable: true}

volumes:
  mysql-data: {}
  redis-data: {}
  storage-data: {}

networks:
  internal: {}
  traefik-public: {external: true}
